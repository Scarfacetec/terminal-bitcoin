<!DOCTYPE html>
<html>
<head>
    <title>Ranking Cripto | Terminal Bitcoin</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #0f0; padding: 10px; text-align: left; }
    </style>
</head>
<body>
    <h1>RANKING CRIPTO - TOP 30</h1>
    <table>
        <tr><th>Rank</th><th>Moeda</th><th>Preço (BRL)</th><th>Var (24h)</th></tr>
        {% for moeda in moedas %}
        <tr>
            <td>{{ moeda.cmc_rank }}</td>
            <td>{{ moeda.name }} ({{ moeda.symbol }})</td>
            <td>R$ {{ "%.2f"|format(moeda.quote.BRL.price) }}</td>
            <td style="color: {{ 'red' if moeda.quote.BRL.percent_change_24h < 0 else 'lime' }}">
                {{ "%.2f"|format(moeda.quote.BRL.percent_change_24h) }}%
            </td>
        </tr>
        {% endfor %}
    </table>
    <br><a href="/">Voltar ao Terminal</a>
</body>
</html>
